<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Permainan pentaksiran bilik darjah untuk Sains KSSM Tingkatan 3, Bidang 2.0 Respirasi. Murid mengembara sebagai molekul oksigen melalui enam hentian yang dipetakan kepada Tahap Penguasaan 1 hingga 6.">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070D18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>Laluan Oksigen</title>
<style>
  :root{color-scheme:light}
  html,body{margin:0;padding:0}
  img{max-width:100%}
  [hidden]{display:none !important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EDF0F5;
  --surface:#FFFFFF;
  --surface2:#F6F8FC;
  --ink:#0D1B2E;
  --ink2:#3D5068;
  --ink3:#6C7F96;
  --line:#DBE2EC;
  --line2:#C3CFDE;
  --arteri:#C8102E;
  --arteri-soft:#FBE8EB;
  --vena:#25395C;
  --teal:#0E8C7F;
  --teal-soft:#DFF2EF;
  --amber:#B07208;
  --amber-soft:#FBF0DB;
  --shadow:0 1px 2px rgba(13,27,46,.06),0 8px 24px -14px rgba(13,27,46,.22);
  --shadow-lift:0 2px 6px rgba(13,27,46,.10),0 20px 44px -20px rgba(13,27,46,.34);
  --r:15px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#070D18;--surface:#0F1A2B;--surface2:#16243A;--ink:#E8EEF8;--ink2:#AABCD3;
    --ink3:#7B8EA8;--line:#1E2D45;--line2:#2B3E5B;--arteri:#FF6068;--arteri-soft:#2B1620;
    --vena:#8AA3CC;--teal:#2FC2AE;--teal-soft:#0C2B29;--amber:#F0B255;--amber-soft:#2A2013;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px -14px rgba(0,0,0,.8);
    --shadow-lift:0 2px 6px rgba(0,0,0,.55),0 20px 44px -20px rgba(0,0,0,.9);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#070D18;--surface:#0F1A2B;--surface2:#16243A;--ink:#E8EEF8;--ink2:#AABCD3;
  --ink3:#7B8EA8;--line:#1E2D45;--line2:#2B3E5B;--arteri:#FF6068;--arteri-soft:#2B1620;
  --vena:#8AA3CC;--teal:#2FC2AE;--teal-soft:#0C2B29;--amber:#F0B255;--amber-soft:#2A2013;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 8px 24px -14px rgba(0,0,0,.8);
  --shadow-lift:0 2px 6px rgba(0,0,0,.55),0 20px 44px -20px rgba(0,0,0,.9);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--ground);color:var(--ink);
  font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-wrap:break-word;
}
button,input,textarea{-webkit-tap-highlight-color:rgba(0,0,0,.07)}
button{touch-action:manipulation;font:inherit;color:inherit}
h1,h2,h3{font-family:"Bricolage Grotesque","Figtree",sans-serif;margin:0;text-wrap:balance;line-height:1.12;letter-spacing:-.018em}
p{margin:0}
.mono{font-family:"DM Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
:focus-visible{outline:2px solid var(--arteri);outline-offset:3px;border-radius:8px}
.hidden{display:none !important}
.shell{max-width:940px;margin:0 auto;padding-inline:16px;padding-block:0 60px}

/* ---------- bar atas ---------- */
.topbar{position:sticky;top:0;z-index:40;background:var(--ground);border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
@supports ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .topbar{background:color-mix(in srgb,var(--ground) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
}
.topbar-in{max-width:940px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;letter-spacing:-.02em;display:block}
.brand span{display:block;font-size:11px;color:var(--ink3);line-height:1.1;margin-top:1px}
.seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:9px 15px;border-radius:999px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink3);white-space:nowrap;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:999px;cursor:pointer;display:grid;place-items:center;font-size:16px;flex:none}

/* ---------- meter nafas ---------- */
.hud{
  position:sticky;top:58px;z-index:30;
  background:var(--vena);border-radius:var(--r);padding:13px 15px;margin-top:16px;box-shadow:var(--shadow-lift);
  display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;color:#fff;
}
:root[data-theme="dark"] .hud{background:#14243D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hud{background:#14243D}}
.hud .lbl{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.68;display:block}
.hud .val{font-family:"DM Mono",monospace;font-size:21px;line-height:1.15;font-weight:500}
.nafasbar{height:13px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:6px;position:relative}
.nafasbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#4FD1C5,#7BE8D4);transition:width .28s ease}
.nafasbar.lemas i{background:linear-gradient(90deg,#FF7A5C,#FFB088)}
.nafasbar.lemas{animation:berdenyut .55s ease-in-out infinite}
@keyframes berdenyut{0%,100%{opacity:1}50%{opacity:.55}}
.hud .kombo{text-align:right}
.hud .kombo .val{color:#FFD48A}
@media (max-width:560px){
  .hud{grid-template-columns:1fr auto;gap:10px;padding:11px 13px}
  .hud .kombo{grid-row:1;grid-column:2}
  .hud .skor{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid rgba(255,255,255,.14);padding-top:8px}
  .hud .skor .val{font-size:17px}
}

/* ---------- kad panel ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-top:16px}
.panel-hd{padding:17px 19px 15px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.panel-hd .grow{flex:1 1 220px;min-width:0}
.panel-hd h2{font-size:23px}
.panel-bd{padding:19px}
.tp-chip{font-family:"DM Mono",monospace;font-size:11px;letter-spacing:.07em;padding:5px 10px;border-radius:999px;background:var(--arteri-soft);color:var(--arteri);white-space:nowrap;font-weight:500}
.tp-chip.t{background:var(--teal-soft);color:var(--teal)}
.tp-chip.a{background:var(--amber-soft);color:var(--amber)}

/* ---------- peta kanvas ---------- */
#peta{display:block;width:100%;height:auto;aspect-ratio:900/210;max-width:100%}
@media (max-width:600px){#peta{aspect-ratio:520/230}}
.stopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:9px;margin-top:16px}
.stop{
  border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 12px;
  cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px;min-height:74px;
}
.stop:hover{border-color:var(--line2)}
.stop .top{display:flex;align-items:center;gap:7px}
.stop .dot{width:26px;height:26px;border-radius:999px;display:grid;place-items:center;flex:none;border:2px solid var(--line2);background:var(--surface);font-family:"DM Mono",monospace;font-size:12px;color:var(--ink3)}
.stop[data-s="aktif"]{border-color:var(--arteri)}
.stop[data-s="aktif"] .dot{border-color:var(--arteri);background:var(--arteri);color:#fff}
.stop[data-s="lulus"]{border-color:var(--teal)}
.stop[data-s="lulus"] .dot{border-color:var(--teal);background:var(--teal);color:#fff}
.stop .nm{font-weight:650;font-size:13.5px;line-height:1.25}
.stop .tp{font-family:"DM Mono",monospace;font-size:10.5px;color:var(--ink3)}

/* ---------- soalan ---------- */
.qtext{font-size:19px;line-height:1.4;font-weight:600;letter-spacing:-.01em}
.qnote{font-size:13.5px;color:var(--ink3);margin-top:7px}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:15px}
.opt{
  display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;
  border:1.5px solid var(--line);background:var(--surface);border-radius:11px;padding:12px 14px;cursor:pointer;
  font-size:15px;line-height:1.4;min-height:48px;transition:border-color .12s,background .12s;
}
.opt:hover:not(:disabled){border-color:var(--line2);background:var(--surface2)}
.opt .key{flex:none;width:23px;height:23px;border-radius:7px;border:1.5px solid var(--line2);display:grid;place-items:center;font-family:"DM Mono",monospace;font-size:11px;color:var(--ink3);margin-top:1px}
.opt[data-pick="1"]{border-color:var(--vena);background:var(--surface2)}
.opt[data-pick="1"] .key{border-color:var(--vena);background:var(--vena);color:#fff}
.opt[data-mark="ok"]{border-color:var(--teal);background:var(--teal-soft)}
.opt[data-mark="ok"] .key{border-color:var(--teal);background:var(--teal);color:#fff}
.opt[data-mark="no"]{border-color:var(--arteri);background:var(--arteri-soft)}
.opt[data-mark="no"] .key{border-color:var(--arteri);background:var(--arteri);color:#fff}
.opt[data-mark="miss"]{border-color:var(--teal);border-style:dashed}
.opt:disabled{cursor:default}
.opt .ord{flex:none;width:23px;height:23px;border-radius:999px;background:var(--vena);color:#fff;display:grid;place-items:center;font-family:"DM Mono",monospace;font-size:11px;margin-top:1px}
.numrow{display:flex;gap:10px;align-items:center;margin-top:15px;flex-wrap:wrap}
.numrow input{font-family:"DM Mono",monospace;font-size:22px;width:130px;padding:11px 13px;border:1.5px solid var(--line2);border-radius:11px;background:var(--surface);color:var(--ink)}
textarea.free{width:100%;min-height:160px;resize:vertical;margin-top:13px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);padding:13px;font:inherit;font-size:16px;line-height:1.5}

.datatable{width:100%;border-collapse:collapse;font-size:14px}
.datatable th,.datatable td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
.datatable th{font-family:"DM Mono",monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:500;background:var(--surface2)}
.datatable td.n,.datatable th.n{text-align:right}
.datatable td.n{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums}
.datatable tbody tr:last-child td{border-bottom:0}
.scrollx{overflow-x:auto;border:1px solid var(--line);border-radius:11px;margin-top:14px;-webkit-overflow-scrolling:touch}
.figure{margin-top:14px;border:1px solid var(--line);border-radius:11px;padding:13px;background:var(--surface2)}
.figure svg{display:block;width:100%;height:auto}
.figure figcaption{font-size:11.5px;color:var(--ink3);margin-top:7px;font-family:"DM Mono",monospace}

.fb{margin-top:15px;border-radius:12px;padding:13px 15px;font-size:14.5px;line-height:1.5;border:1.5px solid}
.fb.ok{background:var(--teal-soft);border-color:var(--teal)}
.fb.no{background:var(--arteri-soft);border-color:var(--arteri)}
.fb b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:15.5px;margin-bottom:2px}

.actions{display:flex;gap:10px;margin-top:17px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:11px;padding:12px 21px;font-size:15px;font-weight:650;cursor:pointer;background:var(--arteri);color:#fff;box-shadow:var(--shadow);min-height:46px}
.btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--ink2);border:1.5px solid var(--line2);box-shadow:none}
.btn.teal{background:var(--teal)}
.btn.sm{padding:9px 15px;font-size:13.5px;min-height:40px}

/* pips */
.pips{display:flex;gap:5px}
.pip{width:24px;height:5px;border-radius:3px;background:var(--line2)}
.pip.on{background:var(--vena)}
.pip.ok{background:var(--teal)}
.pip.no{background:var(--arteri)}

/* bos */
.bospanel{border-color:var(--arteri);box-shadow:0 0 0 3px var(--arteri-soft),var(--shadow-lift)}
.bostimer{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:12px}
.bostimer i{display:block;height:100%;background:var(--arteri);transition:width .95s linear}

/* hasil */
.result{text-align:center;padding:30px 18px}
.result h2{font-size:26px;margin-bottom:7px}
.result p{color:var(--ink2);max-width:44ch;margin:0 auto;font-size:15px}
.kadbesar{
  width:190px;margin:0 auto 18px;border-radius:16px;padding:18px 15px;
  background:linear-gradient(160deg,var(--vena),#0C1729);color:#fff;box-shadow:var(--shadow-lift);
}
.kadbesar .em{font-size:38px;line-height:1}
.kadbesar .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:17px;margin-top:8px}
.kadbesar .ft{font-size:12px;opacity:.78;margin-top:6px;line-height:1.4}
.badbig{width:88px;height:88px;border-radius:999px;margin:0 auto 16px;display:grid;place-items:center;font-size:38px;background:var(--arteri-soft);border:2px solid var(--arteri)}

/* koleksi kad */
.kadgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:11px}
.kad{border-radius:14px;padding:14px 13px;background:linear-gradient(160deg,var(--vena),#0C1729);color:#fff;min-height:132px;display:flex;flex-direction:column;gap:5px}
.kad.kunci{background:var(--surface2);color:var(--ink3);border:1px dashed var(--line2)}
.kad .em{font-size:26px;line-height:1}
.kad .nm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:14.5px}
.kad .ft{font-size:11.5px;opacity:.8;line-height:1.4}
.kad.kunci .ft{opacity:1}

/* papan pendahulu */
.papan{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14.5px}
.prow:last-child{border-bottom:0}
.prow .rk{font-family:"DM Mono",monospace;color:var(--ink3);font-size:13px}
.prow.saya{font-weight:700}
.prow.saya .rk{color:var(--arteri)}
.prow .sk{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums}

/* cabaran harian */
.harian{
  display:flex;gap:13px;align-items:center;border:1.5px solid var(--amber);background:var(--amber-soft);
  border-radius:13px;padding:13px 15px;margin-top:16px;flex-wrap:wrap;
}
.harian .txt{flex:1 1 190px;min-width:0}
.harian .t{font-weight:700;font-size:15px}
.harian .d{font-size:13px;color:var(--ink2)}

/* cikgu */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 16px;background:var(--surface2);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:13px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--arteri)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;border-left:0;border-right:0;border-top:0;background:transparent;width:100%;min-height:56px}
.row:last-of-type{border-bottom:0}
.row:hover{background:var(--surface2)}
.row>span:first-child{min-width:0}
.row .nm{font-weight:600;font-size:15px}
.row .meta{font-size:12px;color:var(--ink3);font-family:"DM Mono",monospace}
.tpbar{display:flex;gap:3px}
.tpbar i{width:9px;height:20px;border-radius:2px;background:var(--line2);display:block}
.tpbar i.on{background:var(--teal)}
.tpbig{font-family:"DM Mono",monospace;font-size:18px;min-width:44px;text-align:right}
.ulasan{margin:10px 0 4px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ulasan-hd{background:var(--surface2);padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ulasan-hd .nm{font-weight:700;font-size:14px}
.ulasan textarea{width:100%;border:0;background:var(--surface);color:var(--ink);padding:14px;font:inherit;font-size:16px;line-height:1.55;min-height:120px;resize:vertical;display:block}
.ladder{display:flex;flex-direction:column;gap:10px;margin-top:13px}
.rung{border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.rung-hd{display:flex;gap:9px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.rung-hd .k{font-weight:700;font-size:15px}
.rung-hd .n{font-family:"DM Mono",monospace;font-size:12px;color:var(--ink3)}
.rung p{font-size:13.5px;color:var(--ink2);line-height:1.5}
.note{font-size:13px;color:var(--ink3);line-height:1.55;margin-top:15px}

/* ---------- juice ---------- */
#flash{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0;transition:opacity .2s ease}
#flash.on{opacity:1}
#flash.ok{box-shadow:inset 0 0 0 4px var(--teal),inset 0 0 70px -12px var(--teal)}
#flash.no{box-shadow:inset 0 0 0 4px var(--arteri),inset 0 0 70px -12px var(--arteri)}
.apung{
  position:fixed;z-index:61;pointer-events:none;white-space:nowrap;
  font-family:"DM Mono",monospace;font-weight:500;font-size:19px;
  text-shadow:0 1px 3px rgba(0,0,0,.35);animation:naik 1s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes naik{
  0%{opacity:0;transform:translate(-50%,6px) scale(.86)}
  18%{opacity:1;transform:translate(-50%,-6px) scale(1.08)}
  100%{opacity:0;transform:translate(-50%,-52px) scale(1)}
}
@keyframes pop{0%{transform:scale(.82)}55%{transform:scale(1.13)}100%{transform:scale(1)}}
.pop{animation:pop .45s ease}
.opt[data-mark="ok"]{animation:pop .45s ease}

/* ---------- kuasa ---------- */
.kuasa{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center}
.kuasa .tajuk{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);width:100%}
.kbtn{
  display:flex;align-items:center;gap:8px;border:1.5px solid var(--line2);background:var(--surface2);
  border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:650;cursor:pointer;min-height:42px;
}
.kbtn:hover:not(:disabled){border-color:var(--teal)}
.kbtn:disabled{opacity:.38;cursor:not-allowed}
.kbtn em{font-style:normal;font-size:16px;line-height:1}
.kbtn .n{font-family:"DM Mono",monospace;color:var(--ink3);font-weight:400}

/* ---------- grid diagnostik ---------- */
.diag{overflow:auto;max-height:66vh;border:1px solid var(--line);border-radius:12px;margin-top:13px;-webkit-overflow-scrolling:touch}
.diag table{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
.diag th,.diag td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.diag thead th{position:sticky;top:0;background:var(--surface2);z-index:2;font-family:"DM Mono",monospace;font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);font-weight:500;text-align:center}
.diag .soal{position:sticky;left:0;background:var(--surface);z-index:1;min-width:210px;max-width:250px;white-space:normal;border-right:1px solid var(--line);line-height:1.35;text-align:left}
.diag thead .soal{z-index:3;background:var(--surface2)}
.diag tbody tr:last-child td{border-bottom:0}

/* ---------- tambahan: identiti bernombor, mod tenang, penanda bukan warna ---------- */

<script>
(function(){
"use strict";

/* Bab yang dimainkan oleh salinan halaman ini. Satu baris ini sahaja yang
   perlu ditukar untuk menerbitkan bab lain dengan aplikasi yang sama. */
var BAB_ID="t3b2";

/* ============================================================
   KANDUNGAN — dimuatkan daripada fail bank yang berasingan.
   Aplikasi ini tidak tahu apa-apa tentang respirasi. Ia hanya pemain
   bagi mana-mana bab yang mendaftar dirinya dalam window.BANK.
   ============================================================ */
var BAB = (window.BANK && window.BANK[BAB_ID]) || null;
if(!BAB){
  var kotakRalat=document.getElementById("stage");
  if(kotakRalat) kotakRalat.innerHTML=
    '<div class="panel"><div class="panel-bd">'+
    '<p class="qtext">Bank soalan tidak dapat dimuatkan.</p>'+
    '<p class="qnote">Fail kandungan bab tidak sampai ke halaman ini. Cuba muat semula. '+
    'Jika ia berulang, beritahu cikgu supaya pautan boleh disemak.</p>'+
    '</div></div>';
  return;
}

var SPI=BAB.spi, KKO=BAB.kko;
var ARAS=BAB.aras.map(function(a){
  var o={}; for(var k in a) o[k]=a[k];
  o.lampiran = a.lampiran ? (BAB.lampiran[a.lampiran]||null) : null;
  return o;
});

(function pasangJenama(){
  function tulis(pilih,teks){ var e=document.querySelector(pilih); if(e&&teks) e.textContent=teks; }
  tulis(".brand b", BAB.tajuk);
  tulis(".brand span", BAB.subtajuk);
  var ge=document.getElementById("guruEyebrow");
  if(ge) ge.textContent="Sains · Tingkatan "+BAB.tingkatan+" · "+BAB.kod;
  if(BAB.tajuk) document.title=BAB.tajuk;
})();

/* ============================================================
   KEADAAN
   ============================================================ */
var SKEMA=2;                       /* versi skema setiap dokumen tersimpan */
var NAFAS_MAX=100, SUSUT=2.0, GANJARAN=28, DENDA=24, SOALAN_SET=4;
var MIN_HANTAR=150;                /* aksara minimum sebelum tugasan reka cipta boleh dihantar */
var AMBANG=0.8;                    /* nisbah betul minimum untuk dikira menguasai satu hentian */
function ambangItem(n){ return Math.ceil(AMBANG*n); }

var S={
  skrin:"nombor", aras:1, set:[], qi:0,
  nafas:NAFAS_MAX, kombo:0, skor:0, betulBiasa:0, jumlahBiasa:0, bosBetul:false, bosHantar:false,
  pilihan:null, disemak:false, mati:false,
  lulus:{}, kad:{}, salah:[],
  inhaler:0, hemo:0, buang:[],
  rentetan:0, rentetanTarikh:null,
  molPos:null,
  harianTarikh:null, harianSkor:0, modHarian:false,
  masaBos:0, senyap:false, tenang:false,
  no:null, kod:"", kelasId:null, latihan:false,
  minggu:null, mingguSkor:0,
  tabCikgu:"kelas", muridPilih:null, arasDiag:1, papan:"minggu",
  guruBuka:false, fokus:null
};

/* ============================================================
   DATA
   Nama penuh murid TIDAK PERNAH disimpan di jalan yang murid boleh baca.
   Awam  : tetapan/nombor  -> senarai kelas + nombor murid + cap kod
   Cikgu : guru/senarai    -> nombor kepada nama (peraturan db: admin sahaja)
           guru/tetapan    -> cap kod cikgu
           guru/tp-<kelas>-<no> -> pertimbangan TP guru
   Murid : cubaan/<kelas>-<no>-a<n> -> satu dokumen bagi satu hentian,
           percubaan pertama ditulis sekali sahaja dan tidak pernah ditindih
   ============================================================ */
var KELASES=[];        /* [{id,nama,contoh}] */
var NOMBOR={};         /* kelasId -> [{no,cap}] */
var NAMA={};           /* kelasId -> {no: nama penuh}  (mod cikgu sahaja) */
var CUBAAN={};         /* "kelas|no|aras" -> dokumen cubaan */
var GURU={};           /* "kelas|no" -> {tp,sebab} */
var KOD_GURU=null;     /* kod cikgu mentah, hanya dalam ingatan selepas dibuka */
var KOD_ADA=false;     /* adakah kod cikgu sudah pernah ditetapkan */
var KOD_LUAR=null;     /* cap kod cikgu untuk mod tanpa pelayan */
var DB=null, ADA_GURU=false, SUMBER="tempatan";

function pad2(n){ return (n<10?"0":"")+n; }
function cap(s){
  var h=2166136261;
  s=String(s);
  for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return (h>>>0).toString(36);
}
function pseudo(s){
  var h=2166136261;
  for(var i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return ((h>>>0)%1000)/1000;
}
function tarikhTempatan(d){
  d=d||new Date();
  return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());
}
function tarikhSemalam(){
  var d=new Date(); d.setDate(d.getDate()-1); return tarikhTempatan(d);
}
function kunciC(kelas,no,a){ return kelas+"|"+no+"|"+a; }

/* Minggu bermula hari Isnin waktu tempatan. Papan mingguan menetapkan
   semula setiap minggu supaya murid yang mula lambat tidak kekal di bawah
   selama-lamanya, dan murid yang sudah jauh di hadapan tidak boleh berehat. */
function kunciMinggu(d){
  d=d?new Date(d):new Date();
  d.setHours(0,0,0,0);
  var isnin=(d.getDay()+6)%7;
  d.setDate(d.getDate()-isnin);
  return tarikhTempatan(d);
}
function kemasMinggu(){
  var m=kunciMinggu();
  if(S.minggu!==m){ S.minggu=m; S.mingguSkor=0; }
}
function dalamMingguIni(ms){ return ms && kunciMinggu(ms)===kunciMinggu(); }
/* Papan mingguan mengira HENTIAN DILEPASI minggu ini, bukan jumlah markah
   seumur hidup. Ia mengukur kemajuan, bukan siapa paling lama bermain. */
function mingguMurid(kelas,no){
  var lulus=0, skor=0;
  for(var i=1;i<=6;i++){
    var c=cubaanMurid(kelas,no,i);
    if(!c||!c.terbaik) continue;
    if(!dalamMingguIni(c.terbaik.masa)) continue;
    skor+=(c.terbaik.skor||0);
    if(c.terbaik.lulus) lulus++;
  }
  return {lulus:lulus, skor:skor};
}
function kunciG(kelas,no){ return kelas+"|"+no; }
function jalanCubaan(kelas,no,a){ return "cubaan/"+kelas+"-"+no+"-a"+a; }
function jalanTp(kelas,no){ return "guru/tp-"+kelas+"-"+no; }
function kelasKini(){
  for(var i=0;i<KELASES.length;i++) if(KELASES[i].id===S.kelasId) return KELASES[i];
  return KELASES[0]||{id:"contoh",nama:"Kelas contoh",contoh:true};
}
function nomborKelas(id){ return NOMBOR[id]||[]; }
function namaMurid(kelas,no){
  var m=NAMA[kelas]; return (m&&m[no])?m[no]:("Murid No. "+no);
}
function labelMurid(no){ return "No. "+no; }

/* ============================================================
   KELAS CONTOH — supaya skrin cikgu berfungsi sebelum kelas sebenar
   dimasukkan. Kelas ini tidak pernah ditulis ke pangkalan data.
   ============================================================ */
function benihContoh(){
  var namaContoh=["Aisyah binti Rahman","Muhammad Irfan bin Zaidi","Tan Mei Ling",
                  "Arvind a/l Kumaran","Danial Haiqal bin Suhaimi","Nur Batrisyia binti Azman"];
  var tahap=[4,5,5,3,2,1];
  KELASES.push({id:"contoh",nama:"3 Amanah (contoh)",contoh:true});
  NOMBOR.contoh=[]; NAMA.contoh={};
  namaContoh.forEach(function(n,i){
    var no=pad2(i+1);
    NOMBOR.contoh.push({no:no,cap:null});
    NAMA.contoh[no]=n;
    var hingga=Math.min(5,tahap[i]+1);
    for(var a=1;a<=hingga;a++){
      var kolam=ARAS[a-1].soalan.map(function(q,k){ return {q:q,w:pseudo(no+"-p"+a+"-"+k)}; })
                 .sort(function(x,y){ return x.w-y.w; })
                 .slice(0,4).map(function(x){ return x.q; });
      var kuasai = a<=tahap[i];
      var senaraiS=[], betul=0;
      kolam.forEach(function(q,k){
        /* hentian yang dikuasai sentiasa cukup betul, yang belum sentiasa tidak,
           supaya kelas contoh membaca sebagai satu cerita yang munasabah */
        var ok = kuasai ? (k<3 || pseudo(no+"-"+a+"-"+k)<0.7)
                        : (pseudo(no+"-"+a+"-"+k)<0.3);
        if(ok) betul++;
        senaraiS.push({qid:q.id,betul:ok});
      });
      var bosOk = kuasai;
      senaraiS.push({qid:ARAS[a-1].bos.id,betul:bosOk});
      var jum=kolam.length+1;
      var satu={masa:Date.now()-(8-a)*86400000, betul:betul, jumlah:kolam.length,
                bos:bosOk, lulus:((betul+(bosOk?1:0))>=ambangItem(jum)),
                skor:betul*145, mod:"masa", soalan:senaraiS};
      CUBAAN[kunciC("contoh",no,a)]={v:SKEMA,kelas:"contoh",no:no,aras:a,contoh:true,
        pertama:satu, terbaik:satu, kali:1, akhir:satu.masa};
    }
  });
}

/* ============================================================
   KIRAAN TP
   ============================================================ */
/* Cadangan automatik dikira daripada PERCUBAAN PERTAMA setiap hentian.
   TP6 tidak pernah automatik: tugasan reka cipta mesti dibaca guru. */
function tpAuto(kelas,no){
  var t=0;
  for(var i=1;i<=5;i++){
    var c=CUBAAN[kunciC(kelas,no,i)];

/* Kocok kedudukan pilihan sekali semasa mula.
   Bagi soalan satu jawapan, kedudukan jawapan betul diagihkan secara
   BERLAPIS, bukan rawak semata: dalam satu hentian, setiap kedudukan
   dipakai hampir sama banyak, kemudian urutan agihan itu sendiri dikocok.
   Kocokan rawak tulen boleh menghasilkan empat soalan berturut-turut yang
   jawapannya sama-sama A, dan murid cepat perasan corak begitu. */
function kocokSemua(){
  ARAS.forEach(function(a){
    a.soalan.forEach(function(q,i){
      q._lam=a.lampiran||null; q.id="a"+a.n+"q"+(i+1); q.tp=a.n; q.sk=a.sk;
      q.label=ringkas(q.t);
    });
    if(a.bos){ a.bos._lam=a.lampiran||null; a.bos.id="a"+a.n+"bos"; a.bos.tp=a.n; a.bos.sk=a.sk; a.bos.label="BOS · "+ringkas(a.bos.t); }
  });
  ARAS.forEach(function(a){
    var semua=a.soalan.concat([a.bos]).filter(Boolean);
    var ikutBil={};
    semua.forEach(function(q){
      if(q.j!=="pilih") return;
      (ikutBil[q.p.length]=ikutBil[q.p.length]||[]).push(q);
    });
    Object.keys(ikutBil).forEach(function(bil){
      var n=Number(bil), senarai=ikutBil[bil], sasaran=[], mula=rnd(n);
      for(var i=0;i<senarai.length;i++) sasaran.push((mula+i)%n);
      for(var k=sasaran.length-1;k>0;k--){ var j=rnd(k+1),t=sasaran[k];sasaran[k]=sasaran[j];sasaran[j]=t; }
      senarai.forEach(function(q,idx){ letakJawapan(q,sasaran[idx]); });
    });
    semua.forEach(function(q){
      if(q.j==="banyak"||q.j==="susun") kocokBiasa(q);
    });
  });
}
/* Pindahkan jawapan betul ke kedudukan yang ditetapkan, pengganggu dikocok. */
function letakJawapan(q,sasaran){
  var betul=q.p[q.b];
  var lain=q.p.filter(function(_,i){ return i!==q.b; });
  for(var k=lain.length-1;k>0;k--){ var j=rnd(k+1),t=lain[k];lain[k]=lain[j];lain[j]=t; }
  var baru=[],c=0;
  for(var i=0;i<q.p.length;i++) baru.push(i===sasaran?betul:lain[c++]);
  q.p=baru; q.b=sasaran;
}
/* Soalan pelbagai jawapan dan soalan susunan tiada satu kedudukan betul,
   jadi ia dikocok biasa, cuma dielakkan daripada kekal pada susunan asal. */
function kocokBiasa(q){
  var n=q.p.length,idx,cuba=0,ident;
  do{
    idx=[];for(var i=0;i<n;i++)idx.push(i);
    for(var k=n-1;k>0;k--){var j=rnd(k+1),t=idx[k];idx[k]=idx[j];idx[j]=t;}
    ident=true;for(var m=0;m<n;m++)if(idx[m]!==m)ident=false;
    cuba++;
  }while(ident&&cuba<12);
  var peta={};idx.forEach(function(l,b){peta[l]=b;});
  q.b=q.b.map(function(l){return peta[l];});
  var pl=q.p;q.p=idx.map(function(l){return pl[l];});
}

var petaCv=null,petaCtx=null,petaAnim=null,bob=0;
function nodPos(i,w,h){
  var t=i/5;
  return {x:w*0.08+t*w*0.84, y:h*0.52+Math.sin(t*Math.PI*1.35)*h*0.26};
}
function lukisPeta(){
  if(!petaCv)return;
  var dpr=Math.min(window.devicePixelRatio||1,2);
  var w=petaCv.clientWidth,h=petaCv.clientHeight;
  if(!w||!h)return;
  if(petaCv.width!==Math.round(w*dpr)){petaCv.width=Math.round(w*dpr);petaCv.height=Math.round(h*dpr);}
  var c=petaCtx; c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,h);
  var cs=getComputedStyle(document.documentElement);
  var cLine=cs.getPropertyValue("--line2").trim()||"#C3CFDE";
  var cTeal=cs.getPropertyValue("--teal").trim()||"#0E8C7F";
  var cArt=cs.getPropertyValue("--arteri").trim()||"#C8102E";
  var cAmb=cs.getPropertyValue("--amber").trim()||"#B07208";
  var cInk3=cs.getPropertyValue("--ink3").trim()||"#6C7F96";
  var cSurf=cs.getPropertyValue("--surface").trim()||"#fff";
  var tunggu=menungguCikgu();

  var pts=[];for(var i=0;i<6;i++)pts.push(nodPos(i,w,h));
  for(var s=0;s<5;s++){
    var a=pts[s],b=pts[s+1];
    var lebar1=26-s*3.4, lebar2=26-(s+1)*3.4;
    c.beginPath();
    c.moveTo(a.x,a.y-lebar1/2); c.lineTo(b.x,b.y-lebar2/2);
    c.lineTo(b.x,b.y+lebar2/2); c.lineTo(a.x,a.y+lebar1/2); c.closePath();
    c.fillStyle = S.lulus[s+1] ? cTeal+"26" : cLine+"3A";
    c.fill();
    c.strokeStyle = S.lulus[s+1] ? cTeal : cLine;
    c.lineWidth=1.4; c.stroke();
  }
  for(var k=0;k<6;k++){
    var p=pts[k],lulus=!!S.lulus[k+1],aktif=(k+1===S.aras);
    var menunggu=(k===5&&!lulus&&tunggu);
    c.beginPath(); c.arc(p.x,p.y,aktif?15:12,0,Math.PI*2);
    c.fillStyle = lulus?cTeal:(menunggu?cAmb:(aktif?cArt:cSurf));
    c.fill();
    c.lineWidth=2; c.strokeStyle = lulus?cTeal:(menunggu?cAmb:(aktif?cArt:cLine));
    c.stroke();
    c.fillStyle = (lulus||aktif||menunggu)?"#fff":cInk3;
    c.font="500 11px 'DM Mono', monospace"; c.textAlign="center"; c.textBaseline="middle";
    c.fillText(lulus?"✓":(menunggu?"…":String(k+1)),p.x,p.y+0.5);
  }
  var sasar=Math.min(S.aras,6)-1;
  if(S.molPos===null||S.molPos===undefined) S.molPos=sasar;
  S.molPos += (sasar-S.molPos)*0.075;
  if(Math.abs(sasar-S.molPos)<0.002) S.molPos=sasar;
  var lo=Math.max(0,Math.floor(S.molPos)), hi=Math.min(5,lo+1), fr=S.molPos-lo;
  var mp={x:pts[lo].x+(pts[hi].x-pts[lo].x)*fr, y:pts[lo].y+(pts[hi].y-pts[lo].y)*fr};
  var oy=Math.sin(bob)*3.6;
  c.beginPath(); c.arc(mp.x-6,mp.y-24+oy,5.6,0,Math.PI*2); c.fillStyle=cArt; c.fill();
  c.beginPath(); c.arc(mp.x+6,mp.y-24+oy,5.6,0,Math.PI*2); c.fillStyle=cArt; c.fill();
  c.globalAlpha=0.28;
  c.beginPath(); c.arc(mp.x,mp.y-24+oy,15,0,Math.PI*2); c.strokeStyle=cArt; c.lineWidth=1.5; c.stroke();
  c.globalAlpha=1;
}
function mulaPetaAnim(){
  if(petaAnim)cancelAnimationFrame(petaAnim);
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){lukisPeta();return;}
  (function loop(){ bob+=0.055; lukisPeta(); petaAnim=requestAnimationFrame(loop); })();
}

/* ============================================================

   ============================================================ */
function binaSet(n){
  var a=ARAS[n-1];
  var jum=Math.min(SOALAN_SET,a.soalan.length);
  var pilih=ambilRawak(a.soalan,jum);
  pilih.forEach(function(q){ q._ulang=false; });
  /* Ulangan pintar: satu soalan yang pernah salah dari hentian terdahulu.
     Ia latihan sahaja — tidak dikira dalam keputusan hentian ini dan
     tidak direkod sebagai bukti hentian ini. */
  if(S.salah.length && n>1 && Math.random()<0.8){
    var s=S.salah[rnd(S.salah.length)];
    if(s && s.aras<n){ s.q._ulang=true; pilih.splice(rnd(pilih.length),0,s.q); }
  }
  a.bos._ulang=false;
  pilih.push(a.bos);
  return pilih;
}
function mulaAras(n){
  S.aras=n; S.set=binaSet(n); S.qi=0;
  S.nafas=NAFAS_MAX; S.kombo=0; S.skor=0; S.mati=false; S.modHarian=false;
  S.betulBiasa=0; S.bosBetul=false; S.bosHantar=false;
  S.jumlahBiasa=S.set.filter(function(q){ return !q._ulang && q!==ARAS[n-1].bos; }).length;
  reset(); S.skrin="main"; render(); mulaJam();
  window.scrollTo({top:0,behavior:"smooth"});
}
function mulaHarian(){
  var semua=[];
  ARAS.forEach(function(a){ a.soalan.forEach(function(q){ if(q.j!=="buka"){ q._ulang=false; semua.push(q); } }); });
  S.set=ambilRawak(semua,5); S.qi=0;
  S.nafas=NAFAS_MAX; S.kombo=0; S.skor=0; S.mati=false; S.modHarian=true;
  S.betulBiasa=0; S.jumlahBiasa=S.set.length; S.bosBetul=false; S.bosHantar=false;
  reset(); S.skrin="main"; render(); mulaJam();
  window.scrollTo({top:0,behavior:"smooth"});
}
function reset(){ S.pilihan=null; S.disemak=false; S.masaBos=0; S.buang=[]; }

function adaJawapan(q){
  if(q.j==="pilih")return S.pilihan!==null&&S.pilihan>=0;
  if(q.j==="banyak"||q.j==="susun")return S.pilihan&&S.pilihan.length>0;
  if(q.j==="nombor")return S.pilihan!==null&&S.pilihan!=="";
  if(q.j==="buka")return S.pilihan&&S.pilihan.trim().length>=MIN_HANTAR;
  return false;
}

function semak(masaHabis){
  var q=S.set[S.qi];
  var bos=(q===ARAS[S.aras-1].bos)&&!S.modHarian;

  /* Tugasan reka cipta tidak pernah dinilai oleh mesin.
     Panjang teks bukan ukuran mereka cipta — ia dihantar kepada guru. */
  if(q.j==="buka"){
    q._betul=null; q._hantar=true; S.bosHantar=true; S.disemak=true;
    S.nafas=Math.min(NAFAS_MAX,S.nafas+GANJARAN);
    S.karangan=S.pilihan;
    bunyi("kad"); aturDegup(); render();
    return;
  }

  var betul=false;
  if(!masaHabis){
    if(q.j==="pilih")betul=S.pilihan===q.b;
    else if(q.j==="banyak")betul=eqSet(S.pilihan,q.b);
    else if(q.j==="susun")betul=eq(S.pilihan,q.b);
    else if(q.j==="nombor")betul=Math.abs(parseFloat(S.pilihan)-q.b)<=(q.tol||0.05);
  }
  q._betul=betul; S.disemak=true;

  var skorLama=S.skor, kuasaBaru=null;

  if(betul){
    if(bos) S.bosBetul=true;
    else if(!q._ulang) S.betulBiasa++;
    S.kombo++;
    S.skor += (bos?300:100)*ganda();
    S.nafas=Math.min(NAFAS_MAX,S.nafas+GANJARAN);
    bunyi("betul");
    S.salah=S.salah.filter(function(x){return x.q!==q;});
    if(S.kombo%3===0){
      if(S.kombo%6===0){ if(S.hemo<3){S.hemo++;kuasaBaru="hemo";} }
      else { if(S.inhaler<3){S.inhaler++;kuasaBaru="inhaler";} }
    }
  } else {
    S.kombo=0;
    if(!S.tenang) S.nafas=Math.max(0,S.nafas-DENDA);
    bunyi("salah");
    if(!S.modHarian && !S.salah.some(function(x){return x.q===q;})) S.salah.push({aras:S.aras,q:q});
  }
  aturDegup(); render();

  kilat(betul?"ok":"no");
  var bar=$("bar"), skorEl=$("vSkor");
  if(betul){
    apung("+"+GANJARAN+" nafas",warnaTok("--teal","#0E8C7F"),bar);
    bergolek(skorLama,S.skor);
    setTimeout(function(){ apung("+"+(S.skor-skorLama),"#FFD48A",skorEl); },120);
    if(ganda()>1) denyut($("vKombo"));
  } else if(!S.tenang){
    apung("−"+DENDA+" nafas",warnaTok("--arteri","#C8102E"),bar);
  }
  if(kuasaBaru){
    setTimeout(function(){
      bunyi("kad");
      var kb=$(kuasaBaru==="hemo"?"btnHemo":"btnInhaler");
      denyut(kb);
      apung(kuasaBaru==="hemo"?"Hemoglobin!":"Inhaler!",warnaTok("--teal","#0E8C7F"),kb||bar);
    },260);
  }
  if(!S.tenang && S.nafas<=0) setTimeout(pengsan,700);
}

/* ---------- kuasa ---------- */
function gunaInhaler(){
  if(S.inhaler<1||S.disemak)return;
  S.inhaler--;
  var sebelum=S.nafas;
  S.nafas=Math.min(NAFAS_MAX,S.nafas+40);
  bunyi("betul"); aturDegup(); render();
  apung("+"+Math.round(S.nafas-sebelum)+" nafas",warnaTok("--teal","#0E8C7F"),$("bar"));
}
function gunaHemo(){
  var q=S.set[S.qi];
  if(S.hemo<1||S.disemak)return;
  if(q.j!=="pilih"&&q.j!=="banyak")return;
  var salahIdx=[];
  q.p.forEach(function(_,i){
    var bt = q.j==="banyak" ? q.b.indexOf(i)>=0 : q.b===i;
    if(!bt && S.buang.indexOf(i)<0) salahIdx.push(i);
  });
  if(salahIdx.length<1)return;
  S.hemo--;
  S.buang=S.buang.concat(ambilRawak(salahIdx,Math.min(2,salahIdx.length)));
  if(S.pilihan!==null){
    if(q.j==="banyak") S.pilihan=S.pilihan.filter(function(i){return S.buang.indexOf(i)<0;});
    else if(S.buang.indexOf(S.pilihan)>=0) S.pilihan=-1;
  }
  bunyi("betul"); render();
}

/* ---------- rentetan hari (tarikh tempatan, bukan UTC) ---------- */
function kemasRentetan(){
  var hariIni=tarikhTempatan();
  if(S.rentetanTarikh===hariIni) return;
  S.rentetan = (S.rentetanTarikh===tarikhSemalam()) ? (S.rentetan||0)+1 : 1;
  S.rentetanTarikh=hariIni;
}

function seterusnya(){
  S.qi++;
  if(S.qi>=S.set.length){ return S.modHarian?hasilHarian():hasilAras(); }
  reset(); render(); window.scrollTo({top:0,behavior:"smooth"});
}

function masukMurid(no){
  S.no=no; S.latihan=false;
  S.lulus=kiraLulus();
  var t=tpDicapai(S.lulus);
  S.aras=(t>0&&t<6)?t+1:(t===6?6:1);
  simpanDiri();
  S.skrin="peta"; render();
}
function kiraLulus(){
  var L={};
  if(!S.no) return L;
  for(var i=1;i<=6;i++){
    var c=cubaanMurid(S.kelasId,S.no,i);
    if(c&&c.terbaik&&c.terbaik.lulus) L[i]=true;
  }
  var g=guruUntuk(S.kelasId,S.no);
  if(g&&Number(g.tp)>=6) L[6]=true;
  return L;
}

   Halaman ini kini berdiri sendiri, jadi ciri itu ditanggalkan. Tugasan
   reka cipta dibaca oleh cikgu, dan itu memang cara yang lebih betul. */

/* ============================================================
   SIMPANAN
   Tempatan dahulu, pelayan kemudian. Setiap tulisan yang gagal sampai
   ke pelayan masuk ke peti keluar dan dicuba semula, supaya bukti PBD
   tidak hilang hanya kerana wifi sekolah tersekat seketika.

   Tiada satu pun jadual boleh ditulis terus dari sini. Semua tulisan
   melalui fungsi pangkalan data yang menyemak kod dahulu, jadi kod
   murid dan kod cikgu ialah sempadan sebenar, bukan sekadar skrin.
   ============================================================ */
var AWAN = (window.LO_AWAN && window.LO_AWAN.url && window.LO_AWAN.kunci) ? window.LO_AWAN : null;
var TALIAN = { ada:!!AWAN, sihat:!!AWAN, tertunggak:0 };

function rpc(nama,badan){
  if(!AWAN) return Promise.reject(new Error("luar talian"));
  return fetch(AWAN.url+"/rest/v1/rpc/"+nama,{
    method:"POST",
    headers:{"apikey":AWAN.kunci,"Authorization":"Bearer "+AWAN.kunci,"Content-Type":"application/json"},
    body:JSON.stringify(badan||{})
  }).then(function(r){
    return r.json().catch(function(){return null;}).then(function(j){
      if(!r.ok){ var e=new Error((j&&j.message)||("HTTP "+r.status)); e.badan=j; throw e; }
      TALIAN.sihat=true; return j;
    });
  }).catch(function(e){ if(!e.badan) TALIAN.sihat=false; throw e; });
}
function bacaJadual(jadual,soal){
  if(!AWAN) return Promise.reject(new Error("luar talian"));
  return fetch(AWAN.url+"/rest/v1/"+jadual+"?"+soal,{
    headers:{"apikey":AWAN.kunci,"Authorization":"Bearer "+AWAN.kunci}
  }).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    TALIAN.sihat=true; return r.json();
  }).catch(function(e){ TALIAN.sihat=false; throw e; });
}

/* ---------- peti keluar ---------- */
function petiBaca(){ try{ return JSON.parse(localStorage.getItem("lo2-peti")||"[]"); }catch(e){ return []; } }
function petiTulis(p){ try{ localStorage.setItem("lo2-peti",JSON.stringify(p.slice(-60))); }catch(e){} TALIAN.tertunggak=p.length; lukisTalian(); }
function petiTambah(surat){ var p=petiBaca(); p.push(surat); petiTulis(p); }
function petiHantar(){
  if(!AWAN) return Promise.resolve();
  var p=petiBaca(); if(!p.length) return Promise.resolve();
  var baki=[];
  return p.reduce(function(rantai,surat){
    return rantai.then(function(){
      return rpc(surat.f,surat.b).then(function(hasil){
        if(surat.f==="lo_simpan_cubaan"&&hasil) terimaBarisCubaan(hasil);
      }).catch(function(e){
        /* ralat kod atau data tidak akan berjaya walau dicuba seribu kali,
           jadi ia dibuang. Hanya kegagalan rangkaian yang disimpan semula. */
        if(!e.badan) baki.push(surat);
      });
    });
  },Promise.resolve()).then(function(){ petiTulis(baki); });
}

/* ---------- cubaan ---------- */
function rekodCubaan(a,lulus){
  if(!S.no||S.modHarian||S.latihan) return;
  var senaraiS=S.set.filter(function(q){ return !q._ulang; })
    .map(function(q){ return {qid:q.id, betul:(q._betul===true)}; });
  var kini={
    masa:Date.now(), betul:S.betulBiasa, jumlah:S.jumlahBiasa,
    bos:S.bosBetul, lulus:!!lulus, skor:S.skor,
    mod:S.tenang?"tenang":"masa", soalan:senaraiS
  };
  var karangan=(a===6&&S.bosHantar&&S.karangan)?{teks:String(S.karangan).slice(0,4000),masa:Date.now()}:null;
  simpanCubaan(S.kelasId,S.no,a,kini,karangan);
  S.karangan=null;
}
function gabungCubaan(lama,kelas,no,a,kini,karangan){
  var out = (lama&&lama.v===SKEMA)
    ? {v:SKEMA,kelas:kelas,no:no,aras:a,pertama:lama.pertama||null,terbaik:lama.terbaik||null,
       kali:lama.kali||0,karangan:lama.karangan||null}
    : {v:SKEMA,kelas:kelas,no:no,aras:a,pertama:null,terbaik:null,kali:0,karangan:null};
  if(kini){
    if(!out.pertama) out.pertama=kini;
    if(!out.terbaik||kini.betul>out.terbaik.betul||(kini.lulus&&!out.terbaik.lulus)) out.terbaik=kini;
    out.kali=out.kali+1;
    out.akhir=kini.masa;
  }
  if(karangan) out.karangan=karangan;
  return out;
}
function terimaBarisCubaan(baris){
  if(!baris||!baris.kelas) return;
  var c={v:SKEMA,kelas:baris.kelas,no:baris.no,aras:baris.aras,
         pertama:baris.pertama,terbaik:baris.terbaik,kali:baris.kali,
         karangan:baris.karangan,akhir:baris.akhir};
  CUBAAN[kunciC(c.kelas,c.no,c.aras)]=c;
  simpanSalinan(c);
}
function simpanSalinan(c){
  try{ localStorage.setItem("lo2-cubaan-"+c.kelas+"-"+c.no+"-a"+c.aras,JSON.stringify(c)); }catch(e){}
}
function simpanCubaan(kelas,no,a,kini,karangan){
  var kunci=kunciC(kelas,no,a);
  var badan=gabungCubaan(CUBAAN[kunci],kelas,no,a,kini,karangan);
  CUBAAN[kunci]=badan;
  simpanSalinan(badan);
  if(!AWAN) return;
  var surat={f:"lo_simpan_cubaan",b:{p_kelas:kelas,p_no:no,p_kod:S.kod||"",
             p_aras:a,p_kini:kini,p_karangan:karangan}};
  rpc(surat.f,surat.b)
    .then(function(hasil){ terimaBarisCubaan(hasil); segar(); })
    .catch(function(e){ if(!e.badan){ petiTambah(surat); } lukisTalian(); });
}
function paduCubaan(x,y){
  if(!x) return y; if(!y) return x;
  var out={v:SKEMA,kelas:x.kelas||y.kelas,no:x.no||y.no,aras:x.aras||y.aras};
  var px=x.pertama, py=y.pertama;
  out.pertama=(px&&py)?(px.masa<=py.masa?px:py):(px||py);
  var tx=x.terbaik, ty=y.terbaik;
  out.terbaik=(tx&&ty)?(((ty.betul>tx.betul)||(ty.lulus&&!tx.lulus))?ty:tx):(tx||ty);
  out.kali=Math.max(x.kali||0,y.kali||0);
  out.akhir=Math.max(x.akhir||0,y.akhir||0);
  var kx=x.karangan, ky=y.karangan;
  out.karangan=(kx&&ky)?((ky.masa>kx.masa)?ky:kx):(kx||ky);
  if(x.contoh||y.contoh) out.contoh=true;
  return out;
}
function letakCubaan(c){
  if(!c||!c.kelas||!c.no||!c.aras) return;
  if(c.v===undefined) c.v=SKEMA;
  if(c.v!==SKEMA) return;
  var k=kunciC(c.kelas,c.no,c.aras);
  CUBAAN[k]=paduCubaan(CUBAAN[k],c);
}

    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&k.indexOf("lo-rekod-")===0) buang.push(k);
    }
    buang.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
  }catch(e){}
}

function muatTempatan(){
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i); if(!k) continue;
      var o=null;
      try{ o=JSON.parse(localStorage.getItem(k)); }catch(e){ continue; }
      if(!o||o.v!==SKEMA) continue;
      if(k.indexOf("lo2-kelas-")===0){
        if(!KELASES.some(function(x){return x.id===o.id;})) KELASES.unshift({id:o.id,nama:o.nama});
        NOMBOR[o.id]=o.nombor||[];
      } else if(k.indexOf("lo2-nama-")===0){
        NAMA[o.kelas]=o.nama||{};
      } else if(k.indexOf("lo2-cubaan-")===0){
        letakCubaan(o);
      } else if(k.indexOf("lo2-tp-")===0){
        GURU[kunciG(o.kelas,o.no)]={tp:o.tp,sebab:o.sebab||""};
      }
    }
    var dr=localStorage.getItem("lo2-diri");
    if(dr){
      var d=JSON.parse(dr);
      if(d&&d.v===SKEMA){
        S.kelasId=d.kelasId||null; S.no=d.no||null; S.kod=d.kod||""; S.latihan=!!d.latihan;
        S.kad=d.kad||{}; S.inhaler=d.inhaler||0; S.hemo=d.hemo||0; S.tenang=!!d.tenang;
        S.rentetan=d.rentetan||0; S.rentetanTarikh=d.rentetanTarikh||null;
        S.harianTarikh=d.harianTarikh||null; S.harianSkor=d.harianSkor||0;
        S.senyap=!!d.senyap; S.minggu=d.minggu||null; S.mingguSkor=d.mingguSkor||0;
        if(S.rentetanTarikh&&S.rentetanTarikh!==tarikhTempatan()&&S.rentetanTarikh!==tarikhSemalam()) S.rentetan=0;
      }
    }
  }catch(e){}
  TALIAN.tertunggak=petiBaca().length;
}

function muatJauh(){
  if(!AWAN) return;
  bacaJadual("lo_kelas","select=id,nama,nombor&order=id").then(function(rows){
    if(!rows||!rows.length) return;
    rows.forEach(function(r){
      if(!KELASES.some(function(x){return x.id===r.id;})) KELASES.unshift({id:r.id,nama:r.nama});
      else KELASES.forEach(function(x){ if(x.id===r.id) x.nama=r.nama; });
      NOMBOR[r.id]=r.nombor||[];
    });
    SUMBER="kelas sebenar";
    segar();
  }).catch(function(){ lukisTalian(); });

  bacaJadual("lo_cubaan","select=*").then(function(rows){
    if(!rows||!rows.length) return;
    rows.forEach(function(r){ letakCubaan({v:SKEMA,kelas:r.kelas,no:r.no,aras:r.aras,
      pertama:r.pertama,terbaik:r.terbaik,kali:r.kali,karangan:r.karangan,akhir:r.akhir}); });
    if(S.no) S.lulus=kiraLulus();
    segar();
  }).catch(function(){ lukisTalian(); });

  petiHantar();
}

/* Data cikgu hanya boleh diambil dengan kod cikgu, dan hanya di sinilah
   nama penuh murid pernah masuk ke dalam pelayar. */
function muatGuru(kod){
  return rpc("lo_guru_data",{p_kod:kod}).then(function(d){
    if(!d) return false;
    (d.kelas||[]).forEach(function(r){
      if(!KELASES.some(function(x){return x.id===r.id;})) KELASES.unshift({id:r.id,nama:r.nama});
      else KELASES.forEach(function(x){ if(x.id===r.id) x.nama=r.nama; });
      NOMBOR[r.id]=r.nombor||[];
    });
    Object.keys(d.nama||{}).forEach(function(id){ NAMA[id]=d.nama[id]; });
    (d.cubaan||[]).forEach(function(r){ letakCubaan({v:SKEMA,kelas:r.kelas,no:r.no,aras:r.aras,
      pertama:r.pertama,terbaik:r.terbaik,kali:r.kali,karangan:r.karangan,akhir:r.akhir}); });
    (d.tp||[]).forEach(function(t){ GURU[kunciG(t.kelas,t.no)]={tp:t.tp,sebab:t.sebab||""}; });
    SUMBER="kelas sebenar";
    return true;
  });
}

function segar(){
  var pl=$("pillSumber"); if(pl) pl.textContent=(SUMBER==="kelas sebenar")?"Kelas sebenar":"Data contoh";
  lukisTalian();
  if(!$("cikgu").classList.contains("hidden")) renderCikgu();
  if(!$("murid").classList.contains("hidden")){
    if(S.no) S.lulus=kiraLulus();
    if(S.skrin==="peta"||S.skrin==="nombor"||S.skrin==="kelas") render();
  }
}

/* Penunjuk talian: murid perlu tahu jika jawapannya belum sampai ke cikgu. */
function lukisTalian(){
  var e=$("talian"); if(!e) return;
  if(!AWAN){ e.className="talian luar"; e.textContent="Tanpa pelayan"; e.title="Rekod disimpan pada peranti ini sahaja."; return; }
  if(TALIAN.tertunggak>0){ e.className="talian tunggu"; e.textContent=TALIAN.tertunggak+" belum dihantar";
    e.title="Jawapan disimpan pada peranti ini dan akan dihantar apabila talian pulih."; return; }
  if(!TALIAN.sihat){ e.className="talian luar"; e.textContent="Luar talian"; e.title="Tidak dapat menghubungi pelayan."; return; }
  e.className="talian ok"; e.textContent="Tersimpan"; e.title="Semua jawapan sudah sampai ke pelayan.";
}

function ulasanUntuk(nama,tp){
  var n=String(nama).split(" ")[0];
  var t={
   1:n+" dapat mengingat kembali struktur sistem respirasi manusia dan istilah asas bab ini. Langkah seterusnya ialah menerangkan sebab di sebalik setiap struktur, bukan sekadar menamakannya.",
   2:n+" memahami mekanisme pernafasan serta ciri alveolus dan dapat menjelaskan kefahaman tersebut. Perlu lebih banyak latihan mentafsir data gas sebelum bergerak ke TP3.",
   3:n+" boleh mengaplikasikan pengetahuan respirasi untuk menerangkan fenomena harian seperti kenaikan kadar pernafasan selepas bersenam. Galakkan membaca graf dan mengaitkan dua pemboleh ubah.",
   4:n+" mampu menganalisis graf isi padu toraks melawan tekanan udara dan mengenal pasti punca apabila satu komponen sistem gagal. Seterusnya latih menimbang bukti untuk membuat keputusan.",
   5:n+" dapat menilai data klinikal tiga individu, memilih kes berisiko tinggi dan menyokongnya dengan bukti berangka daripada jadual. Sudah bersedia untuk tugasan reka cipta.",
   6:n+" berjaya mereka cipta penyelesaian kualiti udara yang praktikal untuk murid asma di sekolah, lengkap dengan pertimbangan kos dan penerimaan komuniti setempat. Pencapaian cemerlang bagi bab ini."
  };
  return t[tp]||n+" belum menunjukkan bukti penguasaan yang mencukupi bagi bab Respirasi. Cadangan: ulang aktiviti hentian pertama dengan bimbingan rakan sebaya.";
}

function renderCikgu(){
  var terbuka=S.guruBuka;
  $("tabsGuru").classList.toggle("hidden",!terbuka);
  $("paneKunci").classList.toggle("hidden",terbuka);
  ["paneKelas","paneDiag","paneSenarai","paneTangga"].forEach(function(id){
    if(!terbuka) $(id).classList.add("hidden");
  });
  if(!terbuka) return paneKunci();

  var tab=S.tabCikgu;
  [["tabKelas","kelas","paneKelas"],["tabDiag","diag","paneDiag"],
   ["tabSenarai","senarai","paneSenarai"],["tabTangga","tangga","paneTangga"]].forEach(function(x){
    $(x[0]).setAttribute("aria-selected",tab===x[1]);
    $(x[2]).classList.toggle("hidden",tab!==x[1]);
  });
  if(tab==="kelas") paneKelas();
  else if(tab==="diag") paneDiag();
  else if(tab==="senarai") paneSenarai();
  else paneTangga();
}

/* ---------------- Kunci mod cikgu ---------------- */
function paneKunci(){
  var p=$("paneKunci"); p.innerHTML="";
  var baharu=!KOD_ADA;
  p.appendChild(el("h3",null,baharu?"Tetapkan kod cikgu":"Kod cikgu"));
  p.appendChild(el("p","note",baharu
    ? "Skrin ini memaparkan nama penuh murid dan tahap penguasaan mereka. Tetapkan satu kod sekarang, sekurang-kurangnya empat aksara. Selepas ini hanya sesiapa yang tahu kod itu boleh melihat nama murid."
    : "Masukkan kod cikgu untuk melihat nama dan rekod murid."));
  var row=el("div","numrow");
  var inp=el("input");inp.type="password";inp.id="kodGuru";inp.className="pin";inp.placeholder="••••";
  inp.setAttribute("data-f","kodguru");
  row.appendChild(inp);
  var bt=el("button","btn");bt.textContent=baharu?"Simpan kod":"Buka";
  var msg=el("p","qnote","");
  function gagal(t){ msg.textContent=t; msg.className="qnote gagal"; inp.value=""; bt.disabled=false; bt.textContent=baharu?"Simpan kod":"Buka"; }
  function cuba(){
    var v=inp.value.trim();
    /* kod cikgu membuka nama penuh semua murid, jadi ia lebih panjang
       daripada kod murid. Pelayan menguatkuasakan had yang sama. */
    if(v.length<8) return gagal("Kod cikgu perlu sekurang-kurangnya lapan aksara, kerana ia membuka nama semua murid.");
    bt.disabled=true; bt.textContent="Menyemak...";
    msg.className="qnote"; msg.textContent="";
    if(!AWAN){
      /* tanpa pelayan, kod disemak pada peranti ini sahaja */
      var capV=cap("guru:"+v);
      if(baharu){ KOD_LUAR=capV; KOD_ADA=true; try{localStorage.setItem("lo2-kodluar",capV);}catch(e){} }
      else if(capV!==KOD_LUAR) return gagal("Kod tidak sepadan.");
      KOD_GURU=v; S.guruBuka=true; return renderCikgu();
    }
    var langkah = baharu
      ? rpc("lo_guru_tetap_kod",{p_kod_lama:null,p_kod_baru:v}).then(function(ok){
          if(!ok) throw new Error("Kod itu tidak dapat ditetapkan. Mungkin sudah ada kod cikgu untuk pautan ini.");
          KOD_ADA=true; return true;
        })
      : Promise.resolve(true);
    langkah.then(function(){ return muatGuru(v); })
      .then(function(){ KOD_GURU=v; S.guruBuka=true; renderCikgu(); })
      .catch(function(e){
        gagal(/kod cikgu tidak sah/i.test(e.message||"") ? "Kod tidak sepadan." :
              (e.badan ? (e.message||"Tidak berjaya.") : "Tidak dapat menghubungi pelayan. Cuba lagi."));
      });
  }
  bt.onclick=cuba;
  inp.onkeydown=function(e){ if(e.key==="Enter") cuba(); };
  row.appendChild(bt);
  p.appendChild(row); p.appendChild(msg);
  p.appendChild(el("p","note",AWAN
    ? "Nama murid tidak pernah dihantar ke pelayar tanpa kod ini. Peraturan pangkalan data menyekatnya di pelayan, jadi murid yang membuka pautan yang sama tidak dapat membacanya walau apa pun yang mereka cuba."
    : "Pelayan tidak dapat dihubungi, jadi kod ini dan semua rekod hanya wujud pada peranti ini."));
  setTimeout(function(){ var e=$("kodGuru"); if(e) e.focus(); },30);
}

function butiranMurid(kelas,no,auto,lapor){
  var w=el("div","ulasan");
  var hd=el("div","ulasan-hd");
  hd.appendChild(el("span","nm",esc(namaMurid(kelas,no))));
  hd.appendChild(el("span","meta","Cadangan automatik: TP"+auto));

  var tb=el("table","cubtab");

  var ada=false;
  for(var a=1;a<=6;a++){
    var c=cubaanMurid(kelas,no,a);

    ada=true;
    th+='<tr><td>'+a+' · '+esc(ARAS[a-1].tempat)+'</td>'+
        '<td class="n">'+c.pertama.betul+' / '+c.pertama.jumlah+'</td>'+
        '<td class="n">'+(c.pertama.bos?"✓":"✗")+'</td>'+
        '<td class="n">'+(c.terbaik?c.terbaik.betul+' / '+c.terbaik.jumlah:"—")+'</td>'+
        '<td class="n">'+(c.kali||0)+'</td>'+
        '<td class="n">'+(c.pertama.mod==="tenang"?"tenang":"masa")+'</td>'+
        '<td class="n">'+tarikhPendek(c.pertama.masa)+'</td></tr>';

  th+='</tbody>';
  if(ada){ tb.innerHTML=th; w.appendChild(tb); }
  else { var kos=el("div"); kos.style.padding="12px 14px"; kos.className="note"; kos.textContent="Belum ada percubaan direkod."; w.appendChild(kos); }

  var kar=adaKarangan(kelas,no);

    sel.appendChild(o);

  sel.onchange=function(ev){

    GURU[kk].tp=(sel.value===""?null:Number(sel.value));

  sb.value=(g&&g.sebab)||"";
  sb.onclick=function(ev){ev.stopPropagation();};
  sb.onchange=function(){
    var kk=kunciG(kelas,no);

  ta.onclick=function(ev){ev.stopPropagation();};

  return w;

  var body="", lemah=[];
  soalan.forEach(function(q){
    var betul=0, cuba=0, sel="";
    murid.forEach(function(no){
      var j=jawapanPertama(kelas,no,q.id);
      if(j===null) sel+='<td><span class="sel kosong" title="Belum cuba">–</span></td>';

    });
    var bahaya=(cuba>0 && betul/cuba<0.5);
    if(bahaya) lemah.push({label:q.label,betul:betul,cuba:cuba});
    body+='<tr class="'+(bahaya?"bahaya":"")+'"><td class="soal">'+(bahaya?'<span class="amaran">!</span> ':'')+esc(q.label)+'</td>'+sel+
          '<td class="kira">'+betul+' / '+cuba+'</td></tr>';
  });
  t.innerHTML=head+body+'</tbody>';
  wrap.appendChild(t);
  p.appendChild(wrap);

  var pet=el("div","petunjuk");
  pet.innerHTML='<span><i class="sel ok">✓</i>Betul</span>'+
                '<span><i class="sel no">✗</i>Salah</span>'+
                '<span><i class="sel kosong">–</i>Belum cuba</span>'+
                '<span><i class="amaran">!</i>Kurang separuh kelas betul</span>';
  p.appendChild(pet);

  if(lemah.length){
    var nota=el("div","fb no"); nota.style.marginTop="14px";
    var li=lemah.map(function(x){
      return '<li style="margin-top:5px">'+esc(x.label)+' <span class="mono">'+x.betul+' / '+x.cuba+'</span></li>';
    }).join("");
    nota.innerHTML='<b>Ajar semula esok</b>Tajuk berikut gagal dikuasai lebih separuh kelas.<ul style="margin:8px 0 0;padding-left:18px">'+li+'</ul>';
    p.appendChild(nota);
  } else {
    p.appendChild(el("p","note","Tiada soalan yang gagal dikuasai lebih separuh kelas pada hentian ini."));
  }
  p.appendChild(el("p","note","Setiap sel ialah jawapan PERTAMA murid bagi soalan itu, diambil daripada percubaan pertama hentian berkenaan. Sel kosong bermakna soalan itu belum pernah keluar untuk murid berkenaan, kerana setiap pusingan mengambil soalan secara rawak daripada bank. Soalan ulangan daripada hentian terdahulu tidak direkod di sini."));
}

/* ---------------- Senarai kelas ---------------- */
function kodRawak(){ return String(1000+Math.floor(Math.random()*9000)); }

function paneSenarai(){
  var p=$("paneSenarai"); p.innerHTML="";
  pilihKelasGuru(p);

  var act0=el("div","actions");
  var bbaru=el("button","btn ghost sm"); bbaru.textContent="Tambah kelas baharu";
  bbaru.onclick=function(){
    var id="k"+(Date.now().toString(36));
    KELASES.push({id:id,nama:"Kelas baharu"});
    NOMBOR[id]=[]; NAMA[id]={};
    S.kelasId=id; simpanKelasGuru(id); renderCikgu();
  };
  act0.appendChild(bbaru);
  if(KELASES.length>1){
    var bbuang=el("button","btn ghost sm"); bbuang.textContent="Buang kelas ini";
    bbuang.onclick=function(){
      var id=S.kelasId;
      KELASES=KELASES.filter(function(k){return k.id!==id;});
      delete NOMBOR[id]; delete NAMA[id];
      S.kelasId=KELASES[0].id; S.muridPilih=null;
      buangKelasGuru(id); renderCikgu();
    };
    act0.appendChild(bbuang);
  }
  p.appendChild(act0);

  var k=kelasKini();
  p.appendChild(el("p","note","Tampal senarai nama kelas anda, satu nama satu baris. Setiap murid diberi nombor mengikut urutan senarai serta satu kod empat angka. Murid hanya nampak nombor, tidak pernah nama. Cetak jadual di bawah dan berikan kepada murid."));

  var row=el("div","numrow");
  row.appendChild(el("span",null,"Nama kelas"));
  var nk=el("input"); nk.type="text"; nk.id="namaKelas"; nk.value=k.nama;
  nk.style.maxWidth="240px"; nk.style.fontSize="16px"; nk.style.width="100%";
  row.appendChild(nk);
  p.appendChild(row);

  var ta=el("textarea","free"); ta.id="senaraiTeks";
  var petaNama=NAMA[k.id]||{};
  ta.value=nomborKelas(k.id).map(function(m){ return petaNama[m.no]||""; }).join("\n");
  ta.placeholder="Aisyah binti Rahman\nMuhammad Irfan bin Zaidi\nTan Mei Ling";
  p.appendChild(ta);

  var act=el("div","actions");
  var bs=el("button","btn"); bs.textContent="Simpan senarai";
  bs.onclick=function(){
    var kk=kelasKini();
    kk.nama=nk.value.trim()||kk.nama;
    var baris=ta.value.split("\n").map(function(x){return x.trim();}).filter(function(x){return x.length>1;});
    var lamaNo=nomborKelas(kk.id), lamaNama=NAMA[kk.id]||{};
    var nomborBaru=[], namaBaru={};
    baris.forEach(function(n,i){
      var no=pad2(i+1);
      /* kekalkan kod sedia ada jika nama pada nombor itu tidak berubah */
      var sedia=lamaNo.filter(function(m){return m.no===no;})[0];
      var kodSedia=(KOD_MENTAH[kk.id]||{})[no];
      var samaOrang=(sedia&&lamaNama[no]===n);
      if(samaOrang&&(sedia.cap||kodSedia)){
        /* orang yang sama pada nombor yang sama: kekalkan kodnya */
        nomborBaru.push(kodSedia?{no:no,kod:kodSedia}:{no:no,cap:sedia.cap});
      } else {
        var kod=kodRawak();
        namaBaru["_kod"+no]=kod;
        nomborBaru.push({no:no,kod:kod});
      }
      namaBaru[no]=n;
    });
    /* kod mentah disimpan di jalan cikgu sahaja supaya boleh dicetak semula */
    var kodMentah={};
    Object.keys(namaBaru).forEach(function(x){ if(x.indexOf("_kod")===0){ kodMentah[x.slice(4)]=namaBaru[x]; delete namaBaru[x]; } });
    NOMBOR[kk.id]=nomborBaru; NAMA[kk.id]=namaBaru;
    KOD_MENTAH[kk.id]=KOD_MENTAH[kk.id]||{};
    Object.keys(kodMentah).forEach(function(no){ KOD_MENTAH[kk.id][no]=kodMentah[no]; });
    simpanKelasGuru(kk.id); simpanKodMentah();
    bs.textContent="Disimpan · "+baris.length+" murid";
    setTimeout(function(){ bs.textContent="Simpan senarai"; },1800);
    renderCikgu();
  };
  act.appendChild(bs);
  var bj=el("button","btn ghost"); bj.textContent="Jana semula semua kod";
  bj.onclick=function(){
    var kk=kelasKini();
    KOD_MENTAH[kk.id]={};
    NOMBOR[kk.id]=nomborKelas(kk.id).map(function(m){
      var kod=kodRawak(); KOD_MENTAH[kk.id][m.no]=kod;
      return {no:m.no,kod:kod};
    });
    simpanKelasGuru(kk.id); simpanKodMentah(); renderCikgu();
  };
  act.appendChild(bj);
  p.appendChild(act);

  /* jadual nombor, nama dan kod untuk dicetak */
  var senarai=nomborKelas(k.id);
  if(senarai.length){
    var w=el("div","ulasan");
    w.appendChild(el("div","ulasan-hd",'<span class="nm">Nombor, nama dan kod</span><span class="meta">'+esc(k.nama)+'</span>'));
    var tb=el("table","cubtab");
    var h='<thead><tr><th>No.</th><th>Nama</th><th class="n">Kod</th></tr></thead><tbody>';
    senarai.forEach(function(m){
      var kod=(KOD_MENTAH[k.id]||{})[m.no];
      h+='<tr><td class="mono">'+esc(m.no)+'</td><td>'+esc(namaMurid(k.id,m.no))+'</td>'+
         '<td class="n">'+(kod?esc(kod):((m.cap||m.kod)?"disimpan":"—"))+'</td></tr>';
    });
    tb.innerHTML=h+'</tbody>';
    w.appendChild(tb);
    p.appendChild(w);
    p.appendChild(el("p","note","Kod hanya dipaparkan penuh pada peranti yang menjananya. Jika ia tertulis disimpan, jana semula untuk mendapat senarai baharu yang boleh dicetak."));
  }

  /* tukar kod cikgu */
  var tk=el("div","ulasan");
  tk.appendChild(el("div","ulasan-hd",'<span class="nm">Kod cikgu</span><span class="meta">lapan aksara atau lebih</span>'));
  var tkb=el("div","tindih");
  var tki=el("input"); tki.type="password"; tki.className="pin"; tki.placeholder="kod baharu";
  tki.style.letterSpacing="normal"; tki.style.fontSize="16px"; tki.style.width="190px";
  tkb.appendChild(tki);
  var tkbt=el("button","btn sm"); tkbt.textContent="Tukar kod";
  var tkm=el("span","meta","");
  tkbt.onclick=function(){
    var v=tki.value.trim();
    if(v.length<8){ tkm.textContent="Perlu lapan aksara atau lebih."; return; }
    tkbt.disabled=true; tkm.textContent="Menukar...";
    if(!AWAN){
      KOD_LUAR=cap("guru:"+v); KOD_GURU=v;
      try{ localStorage.setItem("lo2-kodluar",KOD_LUAR); }catch(e){}
      tki.value=""; tkbt.disabled=false; tkm.textContent="Kod ditukar pada peranti ini."; return;
    }
    rpc("lo_guru_tetap_kod",{p_kod_lama:KOD_GURU,p_kod_baru:v}).then(function(ok){
      tkbt.disabled=false; tki.value="";
      if(ok){ KOD_GURU=v; tkm.textContent="Kod ditukar. Guna kod baharu lain kali."; }
      else tkm.textContent="Tidak berjaya menukar kod.";
    }).catch(function(){ tkbt.disabled=false; tkm.textContent="Tidak dapat menghubungi pelayan."; });
  };
  tkb.appendChild(tkbt); tkb.appendChild(tkm);
  tk.appendChild(tkb);
  p.appendChild(tk);
  p.appendChild(el("p","note","Kod cikgu membuka nama penuh semua murid dalam semua kelas. Tukar ia jika sesiapa selain awak pernah melihatnya."));

  if(KELASES.some(function(x){return x.contoh;})){
    var bh=el("button","btn ghost sm"); bh.textContent="Buang kelas contoh";
    bh.onclick=function(){
      KELASES=KELASES.filter(function(x){return !x.contoh;});
      delete NOMBOR.contoh; delete NAMA.contoh;
      Object.keys(CUBAAN).forEach(function(kk){ if(kk.indexOf("contoh|")===0) delete CUBAAN[kk]; });
      if(S.kelasId==="contoh") S.kelasId=(KELASES[0]||{id:null}).id;
      S.muridPilih=null; renderCikgu();
    };
    var a2=el("div","actions"); a2.appendChild(bh); p.appendChild(a2);
    p.appendChild(el("p","note","Kelas contoh hanya wujud dalam ingatan pelayar ini dan tidak pernah ditulis ke pangkalan data."));
  }
}

var KOD_MENTAH={};
function simpanKodMentah(){
  try{ localStorage.setItem("lo2-kod",JSON.stringify({v:SKEMA,kod:KOD_MENTAH})); }catch(e){}
}
function muatKodMentah(){
  try{
    var s=localStorage.getItem("lo2-kod");
    if(s){ var o=JSON.parse(s); if(o&&o.v===SKEMA) KOD_MENTAH=o.kod||{}; }
  }catch(e){}
}

}

/* ---------------- Eksport ---------------- */
function eksport(){
  var kelas=S.kelasId, k=kelasKini();
  var baris=[["Bil","No. Murid","Nama Murid","Kelas","Mata Pelajaran","Bab","Tahap Penguasaan",
              "TP Cadangan Sistem","Ditindih Guru","Sebab Penindihan","Bilangan Percubaan",
              "Tugasan TP6 Dihantar","Jenis Rekod","Ulasan"]];
  senaraiMurid(kelas).forEach(function(no,i){
    var auto=tpAuto(kelas,no), lapor=tpDilapor(kelas,no), g=guruUntuk(kelas,no);
    baris.push([i+1,no,namaMurid(kelas,no),k.nama,"Sains","2.0 Respirasi","TP"+lapor,
      "TP"+auto,(lapor!==auto?"Ya":"Tidak"),(g&&g.sebab)||"",
      bilCubaan(kelas,no), (adaKarangan(kelas,no)?"Ya":"Tidak"),
      (k.contoh?"CONTOH":"Sebenar"),
      ulasanUntuk(namaMurid(kelas,no),lapor)]);
  });
  var csv=baris.map(function(r){return r.map(selCsv).join(",");}).join("\r\n");
  var kotak=$("kotakEksport"); if(!kotak) return; kotak.innerHTML="";
  function papar(){
    var w=el("div","ulasan");
    w.appendChild(el("div","ulasan-hd",'<span class="nm">CSV susunan SPPB</span><span class="meta">Salin ke Excel</span>'));
    var ta=el("textarea"); ta.value=csv; ta.style.minHeight="150px";
    ta.style.fontFamily="'DM Mono',monospace"; ta.style.fontSize="13px";
    w.appendChild(ta); kotak.appendChild(w);
    if(window.innerWidth>700){ ta.focus(); ta.select(); }
  }
  papar();
  try{
    var nama="pbd-"+BAB_ID+"-"+String(k.nama).replace(/\s+/g,"-").toLowerCase()+".csv";
    var blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob);
    var a=el("a"); a.href=url; a.download=nama; a.className="btn sm"; a.textContent="Muat turun "+nama;
    a.style.display="inline-block"; a.style.textDecoration="none"; a.style.lineHeight="22px";
    var bar=el("div","actions"); bar.appendChild(a); kotak.insertBefore(bar,kotak.firstChild);
    setTimeout(function(){ URL.revokeObjectURL(url); },120000);
  }catch(e){}
}

/* ============================================================
   KAWALAN
   ============================================================ */
function tukarMod(m){
  var murid=m==="murid";
  $("murid").classList.toggle("hidden",!murid);
  $("cikgu").classList.toggle("hidden",murid);
  $("btnMurid").setAttribute("aria-pressed",murid);
  $("btnCikgu").setAttribute("aria-pressed",!murid);
  if(murid){ render(); } else { hentiJam(); hentiPetaAnim(); aturDegup(); renderCikgu(); }
  window.scrollTo({top:0,behavior:"smooth"});
}
$("btnMurid").onclick=function(){tukarMod("murid");};
$("btnCikgu").onclick=function(){tukarMod("cikgu");};
$("tabKelas").onclick=function(){S.tabCikgu="kelas";renderCikgu();};
$("tabDiag").onclick=function(){S.tabCikgu="diag";renderCikgu();};
$("tabSenarai").onclick=function(){S.tabCikgu="senarai";renderCikgu();};
$("tabTangga").onclick=function(){S.tabCikgu="tangga";renderCikgu();};
$("btnBunyi").onclick=function(){
  S.senyap=!S.senyap;
  $("btnBunyi").innerHTML=S.senyap?"&#9633;":"&#9834;";
  $("btnBunyi").setAttribute("aria-label",S.senyap?"Hidupkan bunyi":"Matikan bunyi");
  aturDegup(); simpanDiri();
};
$("btnTema").onclick=function(){
  var r=document.documentElement,k=r.getAttribute("data-theme");
  if(!k){var g=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;r.setAttribute("data-theme",g?"light":"dark");}
  else r.setAttribute("data-theme",k==="dark"?"light":"dark");
  lukisPeta();
};
window.addEventListener("resize",function(){ if(S.skrin==="peta")lukisPeta(); });

/* ============================================================
   MULA
   ============================================================ */
function mula(){
  kocokSemua();
  bersihLama();
  benihContoh();
  muatKodMentah();
  try{ KOD_LUAR=localStorage.getItem("lo2-kodluar")||null; }catch(e){}
  if(!AWAN) KOD_ADA=!!KOD_LUAR;
  muatTempatan();
  if(!S.kelasId) S.kelasId=kelasKini().id;
  if(S.senyap)$("btnBunyi").innerHTML="&#9633;";
  kemasMinggu();
  if(S.no){ S.lulus=kiraLulus(); var t=tpDicapai(S.lulus); S.aras=(t>0&&t<6)?t+1:(t===6?6:1); S.skrin="peta"; }
  else if(S.latihan) S.skrin="peta";
  else S.skrin=(KELASES.length>1?"kelas":"nombor");
  render();
  lukisTalian();
  muatJauh();
  if(AWAN) rpc("lo_guru_ada",{}).then(function(a){ KOD_ADA=!!a; }).catch(function(){});
}
mula();

})();
